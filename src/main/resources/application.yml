server:
  port: 5300
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true

spring:
  application:
    name: ryu-blog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # include 里的 profile 恒生效，与 SPRING_PROFILES_ACTIVE 无关。
    # ai 必须在这里：application-ai.yml 里定义了 blog.ai.enabled（AI 总开关）、
    # ai.retry.*（重试策略）等一整套 AI 配置，只有 profile 为 ai 时该文件才会被加载。
    # 原先没有 include，这些配置全是死的——开关读不到、重试参数也不生效。
    include: resilience4j,ai
  output:
    ansi:
      enabled: always
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # 定时任务线程池大小。默认是 1 —— 所有 @Scheduled 任务共用同一个线程：
      # 任何一个慢任务（比如每天凌晨的浏览量同步、过期任务清理）都会把
      # AsyncTaskExecutor 每 5 秒一次的队列轮询一起卡住，异步任务队列直接停摆。
      # 调成 4 让彼此互不阻塞。
      pool:
        size: 4
      thread-name-prefix: ryu-sched-
  webflux:
    base-path: /
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
    r2dbc:
      repositories:
        enabled: true
  r2dbc:
    url: ${DB_URL:r2dbc:mysql://localhost:3306/ryu_blog_webflux?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    pool:
      enabled: true
      initial-size: 10
      max-size: 30
      max-idle-time: 30m
  codec:
    max-in-memory-size: 10MB

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就过期) 单位: 秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: random-128
  token-prefix: Bearer
  # 是否输出操作日志
  is-log: false
  # 是否尝试从 header 里读取 Token
  is-read-header: true
  # 是否尝试从 cookie 里读取 Token
  is-read-cookie: false
  # jwt秘钥
  jwt-secret-key: ${JWT_SECRET:}
  # 配置 Sa-Token 单独使用的 Redis 连接
  alone-redis:
    # Redis数据库索引
    database: ${REDIS_DATABASE:0}
    # Redis服务器地址
    host: ${REDIS_HOST:localhost}
    # Redis服务器连接端口
    port: ${REDIS_PORT:6379}
    # Redis服务器连接密码（默认为空）
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

# 日志配置
logging:
  level:
    root: info
    com.ryu.blog: debug
    org.springframework.r2dbc: info
    io.r2dbc.pool: info
    cn.dev33.satoken: debug
  # 注意：logback-spring.xml 把「目录」当变量用，因此这里配置的是 path 而不是 name。
  # 原先配置 logging.file.name=logs/ryu-blog.log，logback 又在后面拼 `/${APP_NAME}-error.log`
  # → 实际路径变成 logs/ryu-blog.log/ryu-blog-error.log（把文件当目录），四个滚动文件全部写不出来。
  file:
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      # 只暴露健康检查与指标；env / heapdump / loggers（可被 POST 改日志级别）
      # 一律不开放 —— 这些端点一旦暴露，任意登录用户都能读到内存中的密钥。
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      simple:
        enabled: true

# 应用自定义配置
app:
  # 文件上传配置
  upload:
    base-path: ${UPLOAD_PATH:./uploads}
    max-size: 10MB
    allowed-types: jpg,jpeg,png,gif,webp,mp4,mp3,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,rar,7z
  # 缓存配置
  cache:
    article:
      expire: 1h
    category:
      expire: 1h
    tag:
      expire: 1h
    comment:
      expire: 10m



# API文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-query-params-without-oauth2: true
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true
  cache:
    disabled: true

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-home: true
    enable-search: true
    enable-group: false 

# 异步任务执行器配置
task:
  executor:
    # 调度器配置
    scheduler:
      # 最大线程数
      max-threads: 10
      # 队列容量
      queue-capacity: 100
      # 线程空闲时间（秒）
      keep-alive-seconds: 60
      # 线程名称前缀
      thread-name-prefix: task-exec
    # 调度参数
    schedule:
      # 轮询间隔（毫秒）
      poll-interval: 5000
      # 每次从队列取出的任务数
      batch-size: 10
    # 超时配置（毫秒）
    timeout:
      # 默认超时时间（10分钟）
      default: 600000
      # AI生成任务超时时间（10分钟）
      ai-generation: 600000
      # 邮件发送超时时间（30秒）
      email: 30000
      # 报表生成超时时间（5分钟）
      report: 300000
    # 配额限制
    quota:
      # 高优先级任务配额（每用户每小时）
      high-priority-per-hour: 5
      # 配额TTL（小时）
      ttl-hours: 1
    # 任务清理配置
    cleanup:
      # 已完成任务保留天数
      completed-retention-days: 30
      # 失败任务保留天数
      failed-retention-days: 7
      # 清理任务执行时间（cron表达式）
      cron: "0 0 2 * * ?"
