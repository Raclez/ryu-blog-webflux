server:
  port: ${SERVER_PORT}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true

spring:
  application:
    name: ryu-blog
  config:
    # 把 .env 当作 Spring 的一个配置来源导入（properties 格式）。
    # 用的是 Spring Boot 官方的 config.import 机制，没有自定义代码。
    #
    # 为什么不用 @Component + @PostConstruct 读 .env：那种方式在**bean 实例化阶段**
    # 才把值塞进去，而 spring.profiles.active（ConfigData 阶段）、
    # blog.ai.enabled（@ConditionalOnProperty 求值阶段）、logback 的 logging.*
    # 都读得更早 —— .env 对它们完全无效。
    #
    # 注意：import 的文档优先级**低于**导入它的 application.yml，
    # 但占位符 ${VAR} 的取值会在整个 Environment 里找，所以 .env 里的值依然生效。
    # 相对路径以**启动时的工作目录**为准；文件不存在时 optional: 前缀保证不报错。
    import: "optional:file:.env[.properties]"
  profiles:
    # 全部环境变量都没有默认值 —— 缺了就由 application-dev.yml 提供本地兜底值，
    # 或者在 prod 下直接启动失败。
    # 这里保留 dev 默认值是** bootstrapping 的必要条件**：profile 决定了
    # application-dev.yml 会不会被加载，没有它就形成循环依赖。
    # 生产部署必须显式设 SPRING_PROFILES_ACTIVE=prod（compose 与 Dockerfile 都已设）。
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # include 里的 profile 恒生效，与 SPRING_PROFILES_ACTIVE 无关。
    # ai 必须在这里：application-ai.yml 里定义了 blog.ai.enabled（AI 总开关）、
    # ai.retry.*（重试策略）等一整套 AI 配置，只有 profile 为 ai 时该文件才会被加载。
    # 原先没有 include，这些配置全是死的——开关读不到、重试参数也不生效。
    include: resilience4j,ai
  output:
    ansi:
      enabled: always
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # 定时任务线程池大小。默认是 1 —— 所有 @Scheduled 任务共用同一个线程：
      # 任何一个慢任务（比如每天凌晨的浏览量同步、过期任务清理）都会把
      # AsyncTaskExecutor 每 5 秒一次的队列轮询一起卡住，异步任务队列直接停摆。
      # 调成 4 让彼此互不阻塞。
      pool:
        size: 4
      thread-name-prefix: ryu-sched-
  webflux:
    base-path: /
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  data:
    redis:
      # 主机、口令一律由环境变量提供，配置文件里不写默认值 ——
      # 缺了要么拒启动（prod），要么用本地兜底值（dev），都不会悄悄连到某台机器。
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
    r2dbc:
      repositories:
        enabled: true
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 10
      max-size: 30
      max-idle-time: 30m
  codec:
    max-in-memory-size: 10MB

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就过期) 单位: 秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: random-128
  token-prefix: Bearer
  # 是否输出操作日志
  is-log: false
  # 是否尝试从 header 里读取 Token
  is-read-header: true
  # 是否尝试从 cookie 里读取 Token
  is-read-cookie: false
  # jwt秘钥
  jwt-secret-key: ${JWT_SECRET}
  # 配置 Sa-Token 单独使用的 Redis 连接
  # 注意：这里与上面的 spring.data.redis 用的是**同一组**环境变量 ——
  # 两边各写一份默认值会让「Spring Redis 正常、Sa-Token 那条连不上」，
  # 而且连的是两台不同的机器。
  alone-redis:
    # Redis数据库索引
    database: ${REDIS_DATABASE}
    # Redis服务器地址
    host: ${REDIS_HOST}
    # Redis服务器连接端口
    port: ${REDIS_PORT}
    # Redis服务器连接密码
    password: ${REDIS_PASSWORD}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

# 日志配置
logging:
  level:
    root: info
    com.ryu.blog: debug
    org.springframework.r2dbc: info
    io.r2dbc.pool: info
    cn.dev33.satoken: debug
  # 注意：logback-spring.xml 把「目录」当变量用，因此这里配置的是 path 而不是 name。
  # 原先配置 logging.file.name=logs/ryu-blog.log，logback 又在后面拼 `/${APP_NAME}-error.log`
  # → 实际路径变成 logs/ryu-blog.log/ryu-blog-error.log（把文件当目录），四个滚动文件全部写不出来。
  file:
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      # 只暴露健康检查与指标；env / heapdump / loggers（可被 POST 改日志级别）
      # 一律不开放 —— 这些端点一旦暴露，任意登录用户都能读到内存中的密钥。
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      simple:
        enabled: true

# 应用自定义配置
app:
  # 文件上传配置
  upload:
    base-path: ${UPLOAD_PATH}
    max-size: 10MB
    allowed-types: jpg,jpeg,png,gif,webp,mp4,mp3,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,rar,7z
  # 缓存配置
  cache:
    article:
      expire: 1h
    category:
      expire: 1h
    tag:
      expire: 1h
    comment:
      expire: 10m



# API文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-query-params-without-oauth2: true
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true
  cache:
    disabled: true

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-home: true
    enable-search: true
    enable-group: false 

# 异步任务执行器配置
task:
  executor:
    # 调度器配置
    scheduler:
      # 最大线程数
      max-threads: 10
      # 队列容量
      queue-capacity: 100
      # 线程空闲时间（秒）
      keep-alive-seconds: 60
      # 线程名称前缀
      thread-name-prefix: task-exec
    # 调度参数
    schedule:
      # 轮询间隔（毫秒）
      poll-interval: 5000
      # 每次从队列取出的任务数
      batch-size: 10
    # 超时配置（毫秒）
    timeout:
      # 默认超时时间（10分钟）
      default: 600000
      # AI生成任务超时时间（10分钟）
      ai-generation: 600000
      # 邮件发送超时时间（30秒）
      email: 30000
      # 报表生成超时时间（5分钟）
      report: 300000
    # 配额限制
    quota:
      # 高优先级任务配额（每用户每小时）
      high-priority-per-hour: 5
      # 配额TTL（小时）
      ttl-hours: 1
    # 任务清理配置
    cleanup:
      # 已完成任务保留天数
      completed-retention-days: 30
      # 失败任务保留天数
      failed-retention-days: 7
      # 清理任务执行时间（cron表达式）
      cron: "0 0 2 * * ?"

# ==================== 鉴权 / 权限快照 ====================
blog:
  auth:
    # 匿名可访问的公开路径（白名单）。这是安全边界 —— 加一条就是加一个匿名可读的端点。
    # 基础设施路径（静态资源 / 接口文档 / 健康检查 / 认证接口）写死在 SaTokenConfig 里，
    # 这里只放「业务上确实要匿名可达」的接口。
    public-paths:
      # 前台博客的公开只读接口。
      # 原先的白名单写的是 /content/article/list、/content/article/detail/**
      # 这类**并不存在的路由**，而真实存在的 /posts/detail/{id}、
      # /posts/related/{postId}/{limit} 反而没被放行 ——
      # 结果是公开博客的文章正文匿名访问会 401。
      - /posts/front
      - /posts/detail/**
      - /posts/related/**
      - /category/all
      - /category/page
      - /tags/list
      - /tags/hot
      - /tags/page
      - /comment/article/**
      # 公开配置（站点名称/logo/展示参数）。
      # 登录页在拿不到 token 时也要渲染品牌信息，所以必须匿名可达；
      # 只返回 PublicConfigKeys 白名单内的键，AI/安全/存储类配置
      # 仍然待在 /sysConfig/** 的管理员权限之后。
      - /sysConfig/public
      # 公开文件直链。
      # 匿名可访问 —— <img src> 带不了 Authorization 头，
      # 按 ID 的预览路由每次访问都要 system:file:view 权限 + 请求头，
      # 博客正文里的图根本渲染不出来。
      # 文件可见性已下线（桶本身就是匿名可读的），这条路由不再做权限判定。
      - /files/public/**
    # 权限快照的本地缓存（L1，Caffeine）有效期，毫秒。
    # 它只用来扛住「同一秒的连续请求」—— 跨实例的一致性靠下面的 Redis 共享层。
    permission-snapshot-local-ttl-ms: 5000
    # 权限快照的 Redis 共享层（L2）有效期，秒。
    # 角色/权限变更后，新快照会写进 Redis；其它实例的本地缓存过期后从 Redis 读到新的。
    permission-snapshot-redis-ttl-seconds: 300
    # 快照刷新失败后的退避窗口，毫秒。
    # 数据库抖动时避免「每个请求都重试」把查询量放大成风暴。
    permission-snapshot-backoff-ms: 5000
