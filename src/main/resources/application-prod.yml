# 生产环境配置 - 只覆盖需要自定义的配置
server:
  port: ${SERVER_PORT}

logging:
  level:
    root: warn
    com.ryu.blog: info
    org.springframework.r2dbc: warn
    # 生产环境不能打 debug：Sa-Token 的 debug 日志会把 token 值写进文件
    cn.dev33.satoken: info
  file:
    path: /var/log/ryu-blog

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sa-token:
  timeout: 86400

app:
  upload:
    base-path: ${UPLOAD_PATH}
