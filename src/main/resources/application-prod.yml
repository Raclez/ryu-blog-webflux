# 生产环境配置 - 只覆盖需要自定义的配置
server:
  port: ${SERVER_PORT:5300}

logging:
  level:
    root: warn
    com.ryu.blog: info
    org.springframework.r2dbc: warn
  file:
    name: /var/log/ryu-blog/app.log

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sa-token:
  timeout: 86400

app:
  upload:
    base-path: ${UPLOAD_PATH:/data/uploads}
